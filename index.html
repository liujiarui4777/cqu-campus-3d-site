<!doctype html>
<html lang="zh-CN" data-theme="day">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#eef2f6" />
    <meta name="description" content="重庆大学 A / B / C 区三维校园地图（15 km 范围，周边白模）" />
    <title>重庆大学 · 三维校园（A 区 + B 区 + C 区）</title>
    <link rel="stylesheet" href="./cesium/Widgets/widgets.css" />
    <link rel="stylesheet" href="./src/style.css?v=20261028f" />
    <script>
      window.addEventListener('error', function (e) {
        try {
          var el = document.getElementById('error');
          if (el) {
            el.style.display = 'block';
            el.textContent = 'JS 错误: ' + (e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '');
          }
        } catch (err) {}
      });
      window.addEventListener('unhandledrejection', function (e) {
        try {
          var el = document.getElementById('error');
          if (el) {
            el.style.display = 'block';
            el.textContent = 'Promise 错误: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
          }
        } catch (err) {}
      });
    </script>
    <script>
      // 线上走 jsDelivr CDN（GitHub Pages 国内带宽很差），本地走相对路径
      (function () {
        var isGh = location.hostname.endsWith('github.io');
        var cdn = 'https://cdn.jsdelivr.net/gh/liujiarui4777/cqu-campus-3d-site@88ac43728c5776c807a145f9c1b8e482dac8958d/';
        window.__ASSET_BASE = isGh ? cdn : new URL('./', document.baseURI).href;
        window.CESIUM_BASE_URL = isGh ? cdn + 'cesium/' : new URL('./cesium/', document.baseURI).href;
        document.write(
          '<script src="' + (isGh ? cdn + 'cesium/Cesium.js' : './cesium/Cesium.js') + '"><\/script>',
        );
      })();
    </script>
  </head>
  <body>
    <div id="cesium-root"></div>

    <header class="topbar">
      <button class="brand" id="brand-home" title="回到全景">
        <span class="brand-mark"></span>
        <span class="brand-text">
          <h1>重庆大学 · 三维校园</h1>
          <p>A / B / C 区 · 15 km</p>
        </span>
      </button>

      <div class="search">
        <span class="search-icon">⌕</span>
        <input id="search-input" type="search" placeholder="搜索建筑：主教 / B区图书馆 / C区校友会…" autocomplete="off" />
        <div class="search-results" id="search-results"></div>
      </div>

      <div class="tools">
        <button id="nav-btn" class="tool-btn" title="步行导航">导航</button>
        <button id="sat-btn" class="tool-btn" title="切换卫星影像">卫星</button>
        <button id="bus-btn" class="tool-btn" title="校园巴士时刻表">校园巴士</button>
        <div class="times" title="昼夜">
          <button data-time="day" class="active">日</button>
          <button data-time="dusk">昏</button>
          <button data-time="night">夜</button>
        </div>
        <div class="weather" id="weather" title="沙坪坝天气">
          <span class="w-icon" id="weather-icon">☀</span>
          <span id="weather-text">--°</span>
        </div>
      </div>
    </header>

    <nav class="views" id="views" aria-label="视角切换">
      <button data-view="all" class="active">全景</button>
      <button data-view="a">A 区</button>
      <button data-view="b">B 区</button>
      <button data-view="c">C 区</button>
    </nav>

    <button class="back-home" id="back-home" title="返回全景视角（Esc）">↩ 返回全景</button>

    <section class="card" id="card">
      <button class="card-close" id="card-close" aria-label="关闭">×</button>
      <div class="card-photo" id="card-photo-wrap" hidden><img id="card-photo" alt="" /></div>
      <p class="card-sub" id="card-sub"></p>
      <h2 id="card-title"></h2>
      <div class="card-meta" id="card-meta"></div>
      <div class="card-tags" id="card-tags"></div>
      <div class="card-rooms" id="card-rooms"></div>
      <div class="card-extra" id="card-extra"></div>
      <p class="card-desc" id="card-desc"></p>
      <button class="card-back" id="card-back">← 返回全景</button>
    </section>

    <section class="nav-panel" id="nav-panel" hidden>
      <button class="nav-close" id="nav-close" aria-label="关闭">×</button>
      <h3>步行导航</h3>
      <div class="nav-search">
        <span class="nav-dot start"></span>
        <input id="nav-from-input" type="search" placeholder="搜索起点建筑" autocomplete="off" />
        <button class="nav-x" id="nav-from-clear" aria-label="清空">×</button>
        <div class="nav-suggest" id="nav-from-suggest"></div>
      </div>
      <div class="nav-search">
        <span class="nav-dot end"></span>
        <input id="nav-to-input" type="search" placeholder="搜索终点建筑" autocomplete="off" />
        <button class="nav-x" id="nav-to-clear" aria-label="清空">×</button>
        <div class="nav-suggest" id="nav-to-suggest"></div>
      </div>
      <div class="nav-result" id="nav-result">输入起点、终点，或直接点击地图上的建筑</div>
      <button class="nav-clear" id="nav-clear">清除路线</button>
    </section>

    <section class="shuttle" id="shuttle">
      <button class="shuttle-close" id="shuttle-close" aria-label="关闭">×</button>
      <h3>校园巴士</h3>

      <div class="bus-tabs">
        <button data-bus="commuter" class="active">校区交通车</button>
        <button data-bus="campus">校园穿梭巴士</button>
      </div>

      <div class="bus-body" id="bus-body-commuter">
        <div class="bus-next">
          <div class="bus-next-label">下一班</div>
          <div class="bus-next-time" id="bus-next-time">--:--</div>
          <div class="bus-next-meta" id="bus-next-meta">正在读取时刻表…</div>
        </div>

        <div class="shuttle-tabs">
          <button data-dir="outbound" class="active">沙坪坝 → 科学城</button>
          <button data-dir="inbound">科学城 → 沙坪坝</button>
        </div>

        <div class="bus-section-title">今日时刻 <span id="bus-count"></span></div>
        <div class="shuttle-list" id="shuttle-list"></div>

        <div class="bus-section-title">经停站点</div>
        <div class="bus-stops" id="shuttle-stops"></div>

        <div class="bus-meta" id="bus-meta"></div>
        <div class="bus-tips" id="bus-tips"></div>
        <div class="bus-source" id="bus-source"></div>
      </div>

      <div class="bus-body" id="bus-body-campus" hidden>
        <div class="bus-hero">
          <b>D260</b>
          <span>校区间循环 · 免费</span>
        </div>
        <div class="bus-meta" id="campus-meta"></div>
        <div class="bus-tips" id="campus-tips"></div>
        <div class="bus-source" id="campus-source"></div>
      </div>
    </section>

    <div class="boot" id="boot">
      <div class="boot-inner">
        <div class="boot-ring"></div>
        <p id="boot-text">正在生成 A / B / C 区校园…</p>
      </div>
    </div>

    <div class="error" id="error"></div>

    <script type="module" src="./src/app.js?v=20261028f"></script>
  </body>
</html>
