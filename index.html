<!doctype html>
<html lang="zh-CN" data-theme="day">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#eef2f6" />
    <meta name="description" content="重庆大学 A 区三维校园地图" />
    <title>重庆大学 · 三维校园（官方版）</title>
    <link rel="stylesheet" href="./cesium/Widgets/widgets.css" />
    <link rel="stylesheet" href="./src/style.css?v=20261020b" />
    <script>
      window.addEventListener('error', function (e) {
        try {
          var el = document.getElementById('error');
          if (el) {
            el.style.display = 'block';
            el.textContent = 'JS 错误: ' + (e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '');
          }
        } catch (err) {}
      });
      window.addEventListener('unhandledrejection', function (e) {
        try {
          var el = document.getElementById('error');
          if (el) {
            el.style.display = 'block';
            el.textContent = 'Promise 错误: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
          }
        } catch (err) {}
      });
    </script>
    <script>
      window.CESIUM_BASE_URL = new URL('./cesium/', document.baseURI).href;
    </script>
    <script src="./cesium/Cesium.js"></script>
  </head>
  <body>
    <div id="cesium-root"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <div class="brand-text">
          <h1>重庆大学 · 三维校园</h1>
          <p>A 区（沙坪坝正街 174 号）</p>
        </div>
      </div>

      <div class="search">
        <span class="search-icon">⌕</span>
        <input id="search-input" type="search" placeholder="搜索建筑：主教 / 民主湖 / 图书馆…" autocomplete="off" />
        <div class="search-results" id="search-results"></div>
      </div>

      <div class="topright">
        <div class="stats" id="stats"></div>
        <div class="times">
          <button data-time="day" class="active">日</button>
          <button data-time="dusk">昏</button>
          <button data-time="night">夜</button>
        </div>
      </div>
    </header>

    <section class="card" id="card">
      <button class="card-close" id="card-close" aria-label="关闭">×</button>
      <p class="card-sub" id="card-sub"></p>
      <h2 id="card-title"></h2>
      <div class="card-meta" id="card-meta"></div>
      <div class="card-tags" id="card-tags"></div>
      <div class="card-extra" id="card-extra"></div>
      <p class="card-desc" id="card-desc"></p>
      <button class="card-back" id="card-back">← 返回全景</button>
    </section>

    <footer class="dock">
      <div class="dock-actions">
        <button id="home-btn" class="dock-btn" title="回到全景视角">全景</button>
        <button id="nav-btn" class="dock-btn" title="选择起点与终点建筑">步行导航</button>
        <button id="schedule-btn" class="dock-btn" title="导入课表，在地图上显示今天的课">今日课程</button>
      </div>
      <div class="guides" id="guides"></div>
      <div class="dock-status" id="dock-status">点击建筑查看详情 · 拖拽旋转 · 滚轮缩放</div>
    </footer>

    <section class="schedule" id="schedule">
      <button class="schedule-close" id="schedule-close" aria-label="关闭">×</button>
      <h3>今日课程</h3>
      <p class="schedule-date" id="schedule-date"></p>
      <div class="schedule-list" id="schedule-list"></div>
      <textarea id="schedule-input" placeholder="粘贴课表，每行一门课，例如：&#10;周一 8:00-9:40 高等数学 第一教学楼&#10;周一 10:00-11:40 大学物理 理科教学楼"></textarea>
      <button class="schedule-save" id="schedule-save">导入课表</button>
    </section>

    <div class="boot" id="boot">
      <div class="boot-inner">
        <div class="boot-ring"></div>
        <p id="boot-text">正在生成 A 区校园…</p>
      </div>
    </div>

    <div class="error" id="error"></div>

    <script type="module" src="./src/app.js?v=20261020b"></script>
  </body>
</html>
